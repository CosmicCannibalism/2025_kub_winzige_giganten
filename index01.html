<!doctype html>
<html lang="en">

<head>
	<base href="./">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Winzige Giganten — Exhibition</title>
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<!-- PWA manifest for Version 1 -->
	<link rel="manifest" href="manifest01.json">

	<!-- iOS icons (iOS ignores web manifest icons for homescreen) -->
	<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-hooke-180.png">
	<link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-hooke-192.png">
	<link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-hooke-512.png">
	<!-- Preload primary icon to help iOS find it -->
	<link rel="preload" as="image" href="/icons/icon-hooke-180.png">

	<!-- iOS splash screens can be added per-device if desired (not included) -->
	<link rel="stylesheet" href="style.css?v=21">
	<script src="script.js?v=21" defer></script>
</head>

<body>
	<!-- App container -->
	<div class="app" id="app">

	<!-- Video layers: teaser (default visible) and main (hidden until triggered) -->
	<div class="video-wrap">
		<video id="teaserVideo" class="visible" playsinline preload="auto" loop>
			<source src="videos/teaser.mp4" type="video/mp4">
			Your browser does not support the teaser video.
		</video>

	<video id="mainVideo" class="hidden" playsinline preload="metadata">
		<source src="videos/Robert_Hooke.mp4" type="video/mp4">
		Your browser does not support the main video.
	</video>
		<!-- Cinematic vignette overlays -->
		<div class="vignette-teaser"></div>
		<div class="vignette-main"></div>
	</div>		<!-- Loading overlay. Shown until both videos are ready or timeout occurs -->
		<div id="overlay" role="status" aria-live="polite">
			<div class="spinner" aria-hidden="true"></div>
			<div class="overlay-msg" id="overlayMsg">Preparing exhibition, please wait…</div>
			<div class="overlay-actions" id="overlayActions" style="display:none">
				<button id="retryBtn">Retry</button>
			</div>
		</div>

		<!-- Fallback Start button (hidden when overlay dismisses) -->
		<button id="startBtn">Start</button>

	</div>
</body>

</html>
